name: Generate GitHub metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: shihabskytar
          template: classic
          filename: github-metrics.svg
          config_base: header, activity, community, repositories, metadata
          config_languages: details, limit: 8
          plugin_activity: "yes"
          plugin_community: "yes"
          plugin_repositories: "yes"
          plugin_languages: "yes"
